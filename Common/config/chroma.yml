# ==========================================================
# RAG / 向量库配置
# 相对路径一律相对于项目根目录（加载时会自动转绝对路径）
# ==========================================================

# ---- Embedding（本地 Ollama）----
embedding_model_name: ${EMBEDDING_MODEL_NAME:-qwen3-embedding:4b}
ollama_base_url: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}

# ---- Chroma ----
collection_name: ${CHROMA_COLLECTION:-RAG}
# 直接沿用原有索引目录时，把 CHROMA_PERSIST_DIR 设为 RAG/data/chroma_db
persist_directory: ${CHROMA_PERSIST_DIR:-data/chroma_db}

# ---- 检索 ----
k: ${RETRIEVE_TOP_K:-20}                 # 混合检索每路召回数量
top_n: ${RERANK_TOP_N:-3}                # 精排后保留条数
hybrid_weights: [0.6, 0.4]               # [向量检索, BM25]

# ---- Reranker（本地 CrossEncoder）----
# 模型权重不入库，需用 scripts/download_models 或手动放置到该目录
reranker_path: ${RERANKER_PATH:-models/bge-reranker-v2-m3}
device: ${RERANKER_DEVICE:-cpu}
reranker_enabled: ${RERANKER_ENABLED:-true}

# ---- 切块 ----
chunk_size: ${CHUNK_SIZE:-150}
chunk_overlap: ${CHUNK_OVERLAP:-20}
separators: ["\n\n", "\n", "。", "！", "？", " "]

# ---- 入库去重 ----
md5_path: ${CHROMA_MD5_PATH:-data/md5.txt}
